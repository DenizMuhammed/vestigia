<title>Bülten</title>

<style>
    body {
        margin: 0;
        background: #000;
        color: #eaeaea;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh;
    }

    .container {
        max-width: 800px;
        padding: 20px 40px 50px; /* üst boşluk az */
        margin-right: auto;     /* SOLA YASLAMA */
        text-align: left;       /* METİN SOLA YASLI */
    }

    .header {
        font-size: 17px;
        letter-spacing: 3px;
        opacity: 0.7;
        margin-bottom: 24px;
    }

    .content {
        font-size: 18px;
        line-height: 1.4;
        font-weight: 200;
        white-space: pre-line;
margin-bottom: 10px;
    }

    .footer {
        margin-top: 40px;
        font-size: 13px;
        letter-spacing: 2px;
        opacity: 0.5;
    }

    .divider {
        margin: 20px 0;
        opacity: 0.3;
        font-size: 12px;
        letter-spacing: 4px;
    }
</style>
</head>

<body>

<div class="container">
    <div class="header" id="header"></div>

    <div class="header" id="date-divider"></div>

    <div class="content" id="content"></div>

    <div class="header"> █████████ END OF NEWSLETTER █████████</div>

    <div class="footer">
      Muhammed Deniz
    </div>
    <div class="footer">
      2026/Ocak
    </div>
</div>

<script>
    const month = document.querySelector('meta[name="bulletin-month"]').content;
    const content = document.querySelector('meta[name="bulletin-content"]').content;

    document.getElementById("header").innerText =
        ` █████████ ${month} BÜLTENİ █████████`;

    document.getElementById("content").innerText = content.trim();


    const now = new Date();

  const hijriDate = new Intl.DateTimeFormat(
  'tr-TR-u-ca-islamic',
  {
    day: 'numeric',
    month: 'long',
    year: 'numeric'
  }
).format(now);
  
  
// Saat
const time = now.toLocaleTimeString('tr-TR', {
  hour: '2-digit',
  minute: '2-digit'
});

// Gün adı
const weekday = new Intl.DateTimeFormat('tr-TR', {
  weekday: 'long'
}).format(now);

// Gün + Ay adı + Yıl
const dateParts = new Intl.DateTimeFormat('tr-TR', {
  day: 'numeric',
  month: 'long',
  year: 'numeric'
}).format(now);

document.getElementById("date-divider").innerText = `${time} - ${weekday} - ${dateParts} \n${hijriDate}`;


</script>


</body>
