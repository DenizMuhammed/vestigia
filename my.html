<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <title>Vestigia</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, Inter, Arial, sans-serif;
      background: #eef1f5;
      color: #1f2933;
    }

    form {
      width: 100%;
      max-width: 600px;
      padding: 28px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.08),
        0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .title {
      margin-bottom: 14px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 2px;
      text-align: center;
      color: #374151;
    }

    .readonly-block {
      margin-bottom: 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 14px;
      white-space: pre;
    }

    .line {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 14px;
    }

    .line span {
      width: 14px;
      text-align: center;
	
    }

    textarea.single {
      width: 100%;
      min-height: 36px;
      resize: none;
      padding: 8px 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #f9fafb;
    }
	
	textarea.single2 {
  /* 🔹 GENİŞLİK DARALTILDI */
  width: 220px;              /* ihtiyaca göre 180–260px arası oynatılabilir */
  max-width: 100%;

  /* 🔹 SAĞA YASLAMA */
  margin-left: auto;

  /* 🔹 MEVCUT DAVRANIŞLAR KORUNDU */
  min-height: 36px;
  resize: none;
  padding: 8px 10px;

  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  background: #f9fafb;
}

	
	

    textarea.main {
      width: 100%;
      min-height: 160px;
      resize: both;
      padding: 12px 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      background: #f9fafb;
      margin-bottom: 12px;
    }

    textarea:focus {
      outline: none;
      background: #ffffff;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    button {
      margin-top: 10px;
      width: 100%;
      padding: 13px 16px;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      background: #6366f1;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.35);
    }

    button:hover {
      background: #4f46e5;
    }
	
	/* Sadece > satırı için bitişik görünüm */
.line:last-of-type {
  gap: 0;
}

.line:last-of-type span {
  width: auto;
  margin-right: 0;
}

  </style>
</head>

<body>

<form id="msgForm" action="https://formspree.io/f/xojvgdok" method="POST">

  <input type="hidden" name="email" value="longrange_1@hotmail.com">
  <input type="hidden" name="message" id="hiddenMessage">

  <div class="title">VESTIGIUM</div>

  <!-- readonly -->
  <div id="metaBlock" class="readonly-block"></div>

  <!-- ? -->
  <div class="line">
    <span>?</span>
    <textarea id="qText" class="single"></textarea>
  </div>


  <!-- ana metin -->
  <textarea id="mainText" class="main"></textarea>
  
    <div class="line">
    <span>&gt;</span>
    <textarea id="aText" class="single2"></textarea>
  </div>

  <button type="submit">Send</button>
</form>

<script>
  function pad(n) {
    return n.toString().padStart(2, '0');
  }

  const now = new Date();

  const dateStr =
    pad(now.getDate()) + "-" +
    pad(now.getMonth() + 1) + "-" +
    now.getFullYear();

  const startOfDay = new Date(
    now.getFullYear(),
    now.getMonth(),
    now.getDate()
  );

  const minutesOfDay = Math.floor(
    (now.getTime() - startOfDay.getTime()) / 60000
  );

  const unixTimeSeconds = Math.floor(Date.now() / 1000);

  const idLine = `#${minutesOfDay}-${unixTimeSeconds}`;
  const dateLine = `@${dateStr}`;

  document.getElementById("metaBlock").textContent =
    idLine + "\n" + dateLine;

  document.getElementById("msgForm").addEventListener("submit", function () {

    const q = document.getElementById("qText").value || "";
    const a = document.getElementById("aText").value || "";
    const main = document.getElementById("mainText").value || "";

    const finalMessage =
`${idLine}
${dateLine}
? ${q}
${a}> ${main} <${a}`;

    document.getElementById("hiddenMessage").value =
      "##longrange-1-hotmail-com\n" + finalMessage;
  });
</script>

</body>
</html>
