<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <title>Vestigia</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, Inter, Arial, sans-serif;

      /* Daha az göz yoran arka plan */
      background: #eef1f5;
      color: #1f2933;
    }

    form {
      width: 100%;
      max-width: 420px;
      padding: 28px;

      background: #ffffff;
      border-radius: 14px;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.08),
        0 1px 2px rgba(0, 0, 0, 0.05);
    }

    /* Başlık */
    .title {
      margin-bottom: 14px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 2px;
      text-align: center;
      color: #374151;
    }

    textarea {
      width: 100%;
      min-height: 170px;
      resize: vertical;

      padding: 14px 16px;

      font-size: 14px;
      line-height: 1.6;
      font-family: ui-monospace, SFMono-Regular,
                   Menlo, Consolas, monospace;

      color: #111827;
      background: #f9fafb;

      border: 1px solid #d1d5db;
      border-radius: 10px;

      white-space: pre;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    textarea:focus {
      outline: none;
      background: #ffffff;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    button {
      margin-top: 18px;
      width: 100%;
      padding: 13px 16px;

      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.2px;

      color: #ffffff;
      background: #6366f1;

      border: none;
      border-radius: 10px;
      cursor: pointer;

      transition:
        background-color 0.2s,
        transform 0.1s,
        box-shadow 0.1s;

      box-shadow:
        0 6px 16px rgba(99, 102, 241, 0.35);
    }

    button:hover {
      background: #4f46e5;
      transform: translateY(-1px);
      box-shadow:
        0 8px 20px rgba(99, 102, 241, 0.4);
    }

    button:active {
      transform: translateY(0);
      box-shadow:
        0 4px 12px rgba(99, 102, 241, 0.35);
    }
  </style>
</head>

<body>

  <form id="msgForm" action="https://formspree.io/f/xojvgdok" method="POST">

    <input type="hidden" name="email" value="longrange_1@hotmail.com">
    <input type="hidden" name="message" id="hiddenMessage">

    <!-- Başlık -->
    <div class="title">VESTIGIUM</div>

    <textarea id="visibleMessage" required></textarea>

    <button type="submit">Send</button>
  </form>

  <script>
    function pad(n) {
      return n.toString().padStart(2, '0');
    }

    const now = new Date();

    const dateStr =
      pad(now.getDate()) + "-" +
      pad(now.getMonth() + 1) + "-" +
      now.getFullYear();

    const startOfDay = new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );

    const minutesOfDay = Math.floor(
      (now.getTime() - startOfDay.getTime()) / 60000
    );

    const unixTimeSeconds = Math.floor(Date.now() / 1000);

    const initialText =
`#${minutesOfDay}-${unixTimeSeconds}
@${dateStr}
?
>  <`;

    document.getElementById("visibleMessage").value = initialText;

    document.getElementById("msgForm").addEventListener("submit", function () {
      const userText = document.getElementById("visibleMessage").value;
      document.getElementById("hiddenMessage").value =
        "##longrange-1-hotmail-com\n" + userText;
    });
  </script>

</body>
</html>
