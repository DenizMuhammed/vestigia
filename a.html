<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>M.Deniz 💌</title>

<style>
    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(135deg, #1f1c2c, #928dab);
        color: #fff;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        width: 90%;
        max-width: 600px;
        background: rgba(255,255,255,0.08);
        backdrop-filter: blur(12px);
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }

    h2 {
        margin-top: 0;
        font-weight: 600;
        text-align: center;
    }

    textarea {
        width: 100%;
        min-height: 120px;
        resize: none;
        border-radius: 14px;
        border: none;
        padding: 16px;
        font-size: 16px;
        outline: none;
        background: rgba(255,255,255,0.9);
        color: #222;
        box-sizing: border-box;
    }

    button {
        width: 100%;
        margin-top: 16px;
        padding: 14px;
        font-size: 16px;
        font-weight: 600;
        border-radius: 14px;
        border: none;
        cursor: pointer;
        background: linear-gradient(135deg, #ff758c, #ff7eb3);
        color: white;
        transition: transform 0.1s ease, box-shadow 0.1s ease;
        box-shadow: 0 8px 20px rgba(255, 118, 156, 0.4);
    }

    button:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 28px rgba(255, 118, 156, 0.6);
    }

    .result-box {
        margin-top: 24px;
        background: rgba(0,0,0,0.25);
        border-radius: 14px;
        padding: 18px;
        white-space: pre-wrap;
        line-height: 1.6;
        font-size: 15px;
    }

    hr {
        border: none;
        border-top: 1px solid rgba(255,255,255,0.2);
        margin: 28px 0;
    }

    .mail-button {
        background: linear-gradient(135deg, #6a11cb, #2575fc);
        box-shadow: 0 8px 20px rgba(37,117,252,0.4);
    }
</style>
</head>

<body>

<div class="container">

<h2>Ayş'cim Nasılsın</h2>

<textarea id="mood"
placeholder="Seni dinliyorum ne söylemek istersin Bebek ;)"></textarea>

<button onclick="askChatGPT()">Beni Anla 💗</button>

<div id="result" class="result-box"></div>

<hr>

<form action="https://formspree.io/f/FORM_ID" method="POST">
    <input type="hidden" name="message" id="mailMessage">
    <button type="submit" class="mail-button" onclick="prepareMail()">
        Bu Mesajı Sakla ✉️
    </button>
</form>

</div>

<script>
let shg = "8sGkMU8SS2m48T3BlbkFJzvS96SfHsmuvoumxw0hE7APUXorRFbdL76e9ELVrKGrAiD6eVhaiOlKctGW5GxCMpEzoG_6ZwA";
let pref = "sk-";
shg = pref + "proj-QXtKYagxurCKQZ3s0BT6B0YgkeYM1dH1mHjarKfxyMbFguCdVCWBop8XwqW0_" + shg;
async function askChatGPT() {
    const mood = document.getElementById("mood").value;

    if (!mood.trim()) {
        alert("Bir şeyler yazmadan beni çağırma…");
        return;
    }

    const resultBox = document.getElementById("result");
    resultBox.innerText = "Sana bakıyorum… düşünüyorum…";

    const response = await fetch("https://api.openai.com/v1/chat/completions", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + shg
        },
        body: JSON.stringify({
            model: "gpt-4o-mini",
            messages: [
                {
                    role: "system",
                    content: `
Sen yazan kişinin sevgilisisin.
Yanıtların:
- romantik
- esprili
- hafif ironik olabilir
- duygusal zekası yüksek
- kısa ama etkili
- bazen flörtöz
- asla resmi değil
- gerektiğinde teselli eden
- gerektiğinde gülümseten

Cevaplar sevgili tonunda olmalı.
`
                },
                {
                    role: "user",
                    content: mood
                }
            ]
        })
    });

    const data = await response.json();
    const answer =
        data.choices?.[0]?.message?.content ??
        "Şu an kelimelerim seni bulamadı… ama kalbim burada.";

    resultBox.innerText = answer;
}

function prepareMail() {
    document.getElementById("mailMessage").value =
        document.getElementById("result").innerText;
}
</script>

</body>
</html>
